name: Water Usage Alerts

on:
  schedule:
    # Morning digest: 6 AM Eastern (10:00 UTC in summer EDT)
    - cron: "0 10 * * *"
    # Evening summary: 7 PM Eastern (23:00 UTC in summer EDT)
    - cron: "0 23 * * *"
    # Spike check: every 15 minutes
    - cron: "*/15 * * * *"
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: daily, spike, today, or test"
        required: true
        default: "test"

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set today's date (Eastern)
        id: date
        run: echo "today=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ steps.date.outputs.today }}-${{ github.run_number }}
          restore-keys: |
            alert-state-${{ steps.date.outputs.today }}-

      - name: Write config from secrets
        run: |
          cat > config.yaml << 'EOF'
          property:
            name: "The Foundry at Washington Park"
            timezone: "America/New_York"

          bluebot:
            api_key: "${{ secrets.BLUEBOT_API_KEY }}"
            base_url: "https://prod.bluebot.com/flow/v2"
            phases:
              - id: "BB8100016943"
                name: "Phase 1"
                unit_count: 27
                daily_gallon_limit: 2000
              - id: "BB8100014332"
                name: "Phase 2"
                unit_count: 34
                daily_gallon_limit: 3000

          email:
            sender: "foundrywater@gmail.com"
            app_password: "${{ secrets.GMAIL_APP_PASSWORD }}"
            smtp_server: "smtp.gmail.com"
            smtp_port: 587
            always_notify:
              - "foundrynewburgh@gmail.com"
              - "foundrytreasurer@gmail.com"
              - "marthacwhite@gmail.com"
              - "andrew@atticlabs.info"
              - "kevinfrancisbyrnes@gmail.com"
              - "zap6237@aol.com"
              - "charlie@source-savvy.com"

          sms:
            account_sid: "${{ secrets.TWILIO_ACCOUNT_SID }}"
            auth_token: "${{ secrets.TWILIO_AUTH_TOKEN }}"
            from_number: "+18338963879"

          thresholds:
            spike_daily_pct: 1.20
            spike_hourly_pct: 1.20
            persistent_hours: 3
            quiet_hours_start: 22
            quiet_hours_end: 6
          EOF

      - name: Write resident email list
        run: echo "${{ secrets.RESIDENTS_EMAIL_CSV }}" > residents_email.csv

      - name: Write resident SMS list
        run: echo "${{ secrets.RESIDENTS_SMS_CSV }}" > residents_sms.csv

      - name: Run daily digest (6 AM Eastern)
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily')
        run: python main.py --mode daily

      - name: Run spike check (every 15 min)
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'spike')
        run: python main.py --mode spike

      - name: Run evening summary (7 PM Eastern)
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 23 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'today')
        run: python main.py --mode today

      - name: Run test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test'
        run: python main.py --mode test
