name: Daily Water Digest

on:
  schedule:
    # Morning digest: 6:02 AM Eastern (10:02 UTC summer, 11:02 UTC winter)
    # Kept in its own workflow file so GitHub never collapses it with the
    # 15-minute spike-check workflow — the root cause of missed morning digests.
    - cron: "2 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: daily or today"
        required: true
        default: "daily"

jobs:
  daily-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config from secrets
        run: |
          cat > config.yaml << 'EOF'
          property:
            name: "The Foundry at Washington Park"
            timezone: "America/New_York"

          bluebot:
            api_key: "${{ secrets.BLUEBOT_API_KEY }}"
            base_url: "https://prod.bluebot.com/flow/v2"
            phases:
              - id: "BB8100016943"
                name: "Phase 1"
                unit_count: 27
                daily_gallon_limit: 1750
              - id: "BB8100014332"
                name: "Phase 2"
                unit_count: 34
                daily_gallon_limit: 2650
              - id: "BB8100017665"
                name: "Phase 3"
                unit_count: 59
                daily_gallon_limit: 5000

          email:
            sender: "foundrywater@gmail.com"
            sendgrid_api_key: "${{ secrets.SENDGRID_API_KEY }}"
            always_notify:
              - "foundrynewburgh@gmail.com"
              - "foundrytreasurer@gmail.com"
              - "marthacwhite@gmail.com"
              - "andrew@atticlabs.info"
              - "kevinfrancisbyrnes@gmail.com"
              - "zap6237@aol.com"
              - "charlie@source-savvy.com"
              - "lhoye@mcgrathny.com"
              - "hvanhousen@ahcllc.net"

          sms:
            account_sid: "${{ secrets.TWILIO_ACCOUNT_SID }}"
            auth_token: "${{ secrets.TWILIO_AUTH_TOKEN }}"
            from_number: "+18338963879"

          thresholds:
            quiet_hours_start: 22
            quiet_hours_end: 6
            increment_gallons: 250
          EOF

      - name: Write resident email list
        run: echo "${{ secrets.RESIDENTS_EMAIL_CSV }}" > residents_email.csv

      - name: Write resident SMS list
        run: echo "${{ secrets.RESIDENTS_SMS_CSV }}" > residents_sms.csv

      - name: Run morning digest
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily')
        run: python main.py --mode daily

      - name: Run today's running total
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'today'
        run: python main.py --mode today
