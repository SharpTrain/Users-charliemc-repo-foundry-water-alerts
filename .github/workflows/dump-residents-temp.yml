name: TEMP - Dump Residents CSV (one-off recovery, delete after use)

on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Write resident email list
        run: echo "${{ secrets.RESIDENTS_EMAIL_CSV }}" > residents_email.csv

      - name: Upload as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: residents-email-recovery
          path: residents_email.csv
          retention-days: 1
